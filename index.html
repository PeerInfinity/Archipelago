<!DOCTYPE html>
<html lang="en">
  <head>
    <title>JSON Web Client</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="styles/index.css" />
    <link rel="stylesheet" type="text/css" href="styles/loading-screen.css" />
    <link rel="stylesheet" type="text/css" href="styles/mobile.css" />

    <!-- Golden Layout CSS -->
    <link
      type="text/css"
      rel="stylesheet"
      href="libs/golden-layout/css/goldenlayout-base.css"
    />
    <link
      type="text/css"
      rel="stylesheet"
      href="libs/golden-layout/css/themes/goldenlayout-dark-theme.css"
    />

    <script type="module">
      // Support both bundled and unbundled loading modes:
      // - ?dev or ?unbundled: Force unbundled mode (ES modules)
      // - ?bundled: Force bundled mode
      // - Local development (localhost): Default to unbundled
      // - Deployed (other hosts): Try bundled first, fall back to unbundled
      const params = new URLSearchParams(location.search);
      const forceUnbundled = params.has('dev') || params.has('unbundled');
      const forceBundled = params.has('bundled');
      const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

      async function loadApp() {
        if (forceUnbundled) {
          console.log('[Loader] Using unbundled mode (ES modules)');
          await import('./init.js');
          return;
        }

        if (forceBundled) {
          console.log('[Loader] Using bundled mode');
          await import('./dist/bundle.js');
          return;
        }

        // Local development: default to unbundled (no HEAD request noise)
        if (isLocalDev) {
          console.log('[Loader] Using unbundled mode (local development)');
          await import('./init.js');
          return;
        }

        // Deployed: try bundled first, fall back to unbundled
        try {
          // Check if bundle exists by fetching with HEAD request
          const response = await fetch('./dist/bundle.js', { method: 'HEAD' });
          if (response.ok) {
            console.log('[Loader] Using bundled mode (auto-detected)');
            await import('./dist/bundle.js');
          } else {
            throw new Error('Bundle not found');
          }
        } catch (e) {
          console.log('[Loader] Using unbundled mode (bundle not available)');
          await import('./init.js');
        }
      }

      loadApp();
    </script>

    <link rel="icon" href="data:," type="image/x-icon" />
  </head>
  <body>
    <!-- Simple static loading screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <h1>Archipelago JSON Tool</h1>
        <div class="loading-spinner"></div>
        <p>Loading...</p>
        <div class="loading-counter">
          <span id="files-loaded-count">0</span> files loaded
        </div>
        <div class="loading-file-list">
          <div class="file-list-header">Files loaded:</div>
          <div id="file-list-container" class="file-list-scroll">
            <!-- File names will be added here dynamically -->
          </div>
        </div>
      </div>
    </div>

    <div
      id="goldenlayout-container"
      style="width: 100%; height: 100vh; position: relative"
    >
      <!-- Golden Layout will populate this -->
    </div>

    <!-- Modal -->
    <div id="location-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title"></h3>
        <pre id="modal-debug" class="hidden"></pre>
        <div id="modal-info"></div>
        <button id="modal-close" class="button">Close</button>
      </div>
    </div>

    <div id="cookie-message">
      <span
        >This website uses cookies to store information about displayed
        content.</span
      >
      <span>❌</span>
    </div>
  </body>
</html>
